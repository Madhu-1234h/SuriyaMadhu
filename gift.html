<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#FFF3F6">

<title>Happy Birthday Surya 🤍</title>


<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    background:#000;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow:hidden;
}


/* =========================
   SOFT BACKGROUND GLOW
========================= */

body::before{

    content:"";

    position:fixed;

    width:650px;
    height:650px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.09),
            transparent 68%
        );

    animation:
        backgroundGlow
        5s
        ease-in-out
        infinite
        alternate;

    pointer-events:none;

    z-index:0;
}


@keyframes backgroundGlow{

    0%{

        opacity:.3;

        transform:
            translate(-50%,-50%)
            scale(.8);
    }

    100%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.15);
    }
}


/* =========================
   MAIN PAGE
========================= */

.page{

    position:relative;

    width:100%;
    height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:30px;

    z-index:2;
}


.content{

    width:100%;

    max-width:1050px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    align-items:center;

    gap:80px;
}


/* =========================
   LEFT SIDE
========================= */

.message{

    opacity:0;

    transform:
        translateX(-140px);

    animation:
        leftEnter
        1.5s
        cubic-bezier(.22,.61,.36,1)
        forwards;

    animation-delay:.3s;
}


@keyframes leftEnter{

    0%{

        opacity:0;

        transform:
            translateX(-140px);
    }

    70%{

        opacity:1;
    }

    100%{

        opacity:1;

        transform:
            translateX(0);
    }
}


/* Small text */

.small{

    color:#888;

    font-size:11px;

    letter-spacing:6px;

    margin-bottom:22px;

    opacity:0;

    animation:
        fadeUp
        1s
        ease
        forwards;

    animation-delay:1.1s;
}


/* Main birthday text */

.message h1{

    font-size:
        clamp(
            38px,
            5vw,
            68px
        );

    font-weight:300;

    line-height:1.08;

    letter-spacing:6px;

    margin-bottom:28px;

    opacity:0;

    transform:
        translateY(35px);

    animation:
        titleAppear
        1.4s
        cubic-bezier(.22,.61,.36,1)
        forwards;

    animation-delay:1.4s;
}


@keyframes titleAppear{

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


/* =========================
   LINE
========================= */

.line{

    width:0;

    height:1px;

    background:#fff;

    margin-bottom:25px;

    animation:
        lineAppear
        1s
        ease
        forwards;

    animation-delay:2.3s;
}


@keyframes lineAppear{

    to{

        width:150px;
    }
}


/* =========================
   MESSAGE
========================= */

.message p{

    max-width:410px;

    color:#999;

    font-size:15px;

    line-height:1.9;

    opacity:0;

    animation:
        fadeUp
        1s
        ease
        forwards;

    animation-delay:2.5s;
}


/* Small hearts */

.heart-text{

    margin-top:28px;

    font-size:25px;

    letter-spacing:8px;

    opacity:0;

    animation:
        fadeUp
        1s
        ease
        forwards;

    animation-delay:2.9s;
}


@keyframes fadeUp{

    from{

        opacity:0;

        transform:
            translateY(20px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


/* =========================
   RIGHT SIDE PHOTO
========================= */

.photo-section{

    display:flex;

    justify-content:center;

    opacity:0;

    transform:
        translateX(140px)
        scale(.85);

    animation:
        photoEnter
        1.6s
        cubic-bezier(.22,.61,.36,1)
        forwards;

    animation-delay:1.7s;
}


@keyframes photoEnter{

    0%{

        opacity:0;

        transform:
            translateX(140px)
            scale(.85);
    }

    100%{

        opacity:1;

        transform:
            translateX(0)
            scale(1);
    }
}


/* =========================
   PHOTO FRAME
========================= */
.photo-frame img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    border-radius:15px;
    filter:none !important;
    opacity:1;
    transition:.6s ease;
}

@keyframes photoFloat{

    0%,
    100%{

        transform:
            translateY(0);
    }

    50%{

        transform:
            translateY(-12px);
    }
}


/* =========================
   PHOTO
========================= */

.photo-frame img{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;

    border-radius:15px;

    filter:
        grayscale(100%);

    transition:
        .6s
        ease;
}


.photo-frame:hover img{

    filter:
        grayscale(0%);

    transform:
        scale(1.02);
}


/* =========================
   PHOTO CORNERS
========================= */

.corner{

    position:absolute;

    width:28px;

    height:28px;

    border-color:#fff;

    border-style:solid;

    z-index:5;
}


.corner.one{

    top:-6px;

    left:-6px;

    border-width:
        2px
        0
        0
        2px;

    border-radius:
        10px
        0
        0
        0;
}


.corner.two{

    top:-6px;

    right:-6px;

    border-width:
        2px
        2px
        0
        0;

    border-radius:
        0
        10px
        0
        0;
}


.corner.three{

    bottom:-6px;

    left:-6px;

    border-width:
        0
        0
        2px
        2px;

    border-radius:
        0
        0
        0
        10px;
}


.corner.four{

    bottom:-6px;

    right:-6px;

    border-width:
        0
        2px
        2px
        0;

    border-radius:
        0
        0
        10px
        0;
}


/* =========================
   FLOATING WHITE HEARTS
========================= */

.heart{

    position:fixed;

    bottom:-40px;

    color:#fff;

    font-size:15px;

    opacity:0;

    pointer-events:none;

    z-index:1;

    animation:
        heartFloat
        linear
        forwards;
}


@keyframes heartFloat{

    0%{

        transform:
            translateY(0)
            scale(.4)
            rotate(0deg);

        opacity:0;
    }


    15%{

        opacity:.8;
    }


    50%{

        opacity:.6;
    }


    80%{

        opacity:.4;
    }


    100%{

        transform:
            translateY(-115vh)
            scale(1.1)
            rotate(25deg);

        opacity:0;
    }
}


/* =========================
   BOTTOM TEXT
========================= */

.bottom{

    position:fixed;

    bottom:22px;

    left:0;

    width:100%;

    text-align:center;

    color:#7A4A63;

    font-size:9px;

    letter-spacing:4px;

    opacity:0;

    animation:
        fade
        1s
        ease
        forwards;

    animation-delay:3.8s;

    z-index:5;
}


@keyframes fade{

    to{

        opacity:1;
    }
}


/* =========================
   NEXT BUTTON
========================= */

.next-btn{
    position:fixed;

    right:25px;
    bottom:25px;

    padding:9px 16px;

    background:transparent;
    color:#fff;

    border:1px solid #7A4A63;
    border-radius:20px;

    font-size:10px;
    letter-spacing:2px;

    cursor:pointer;

    transition:.3s ease;

    z-index:10;
}

html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
@media(max-width:700px){.page{min-height:100vh;min-height:100dvh;padding-bottom:130px!important}.message h1{font-size:clamp(30px,9.4vw,38px)!important;letter-spacing:2px!important;line-height:1.15}.next-btn{min-height:44px}}
.next-btn:hover{
    border-color:#fff;
    background:#fff;
    color:#000;
}

.next-btn:hover{
    border-color:#fff;
    background:#fff;
    color:#000;
}


.next-btn:hover{

    border-color:#fff;

    background:#fff;

    color:#000;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{

        overflow:auto;
    }


    .page{

        min-height:100vh;

        height:auto;

        padding:
            50px
            20px
            70px;
    }


    .content{

        grid-template-columns:1fr;

        gap:55px;

        max-width:500px;
    }


    .message{

        text-align:center;

        order:1;
    }


    .message h1{

        font-size:39px;

        letter-spacing:4px;
    }


    .small{

        letter-spacing:4px;
    }


    .line{

        margin-left:auto;

        margin-right:auto;
    }


    .message p{

        margin-left:auto;

        margin-right:auto;

        font-size:14px;
    }


    .photo-section{

        order:2;
    }


    .photo-frame{

        width:245px;

        height:315px;
    }


    .bottom{

        position:relative;

        margin-top:40px;

        bottom:auto;
    }


.next-btn{
    right:15px;
    top:auto;
    bottom:25px;
    transform:none;
}

}

</style>

</style>

<body>

========================= -->

                >


            </div>

        </div>


    </div>

</div>



<!-- =========================

========================= -->

<button class="next-btn" onclick="goNext()">
    NEXT
</button>



<!-- Bottom -->

<div class="bottom">

    MADE WITH LOVE 🤍

</div>



<script>


/* =================================
   FLOATING WHITE HEARTS
================================= */

function createHeart(){

    const heart =
        document.createElement("div");


    heart.className =
        "heart";


    const symbols = [

        "♡",
        "♡",
        "♡",
        "♥"

    ];


    heart.innerHTML =
        symbols[
            Math.floor(
                Math.random()
                * symbols.length
            )
        ];


    /* Random horizontal position */

    heart.style.left =
        Math.random()
        * 100
        + "vw";


    /* Random size */

    heart.style.fontSize =
        (
            10 +
            Math.random()*16
        )
        + "px";


    /* Random animation speed */

    heart.style.animationDuration =
        (
            5 +
            Math.random()*5
        )
        + "s";


    /* Random delay */

    heart.style.animationDelay =
        (
            Math.random()*1.5
        )
        + "s";


    heart.style.color=["#E0527F","#FFB6CB","#FFB6CB","#A8559B","#E0527F"][Math.floor(Math.random()*5)];heart.style.textShadow="0 0 15px #FFB6CB";document.body.appendChild(heart);


    /* Remove after animation */

    setTimeout(()=>{

        heart.remove();

    },11000);

}


/* Create hearts */

setInterval(
    createHeart,
    700
);


/* Create a few immediately */

for(let i=0;i<5;i++){

    setTimeout(
        createHeart,
        i*400
    );

}


/* =================================
   NEXT PAGE
================================= */

function goNext(){

    window.location.href =
        "birthdaygift.html";

}


</script>
