<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3F6">
<title>Friends &amp; Family 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="love.css">
<link rel="stylesheet" href="giftcommon.css">

<style>
.blk{
  position:relative;
  overflow:hidden;
  padding:64px 16px 70px;
  text-align:center;
}

.blk.fr{
  background:radial-gradient(ellipse at 12% 0%,rgba(236,95,140,.34),transparent 55%),#FFE9EF;
}

.blk.fa{
  background:radial-gradient(ellipse at 88% 0%,rgba(255,160,185,.45),transparent 55%),radial-gradient(ellipse at 50% 100%,rgba(236,95,140,.25),transparent 55%),#FFF3F6;
  padding-bottom:110px;
}

.blk .ttl{color:#4A1F3A}
.blk .sub{color:#7A4A63}

.dec{
  position:absolute;
  color:#E0527F;
  opacity:.6;
  font-size:22px;
  animation:fl2 4s ease-in-out infinite;
  pointer-events:none;
  text-shadow:0 0 15px #FFB6CB;
}

.dec:nth-child(2){color:#E0A63D}

@keyframes fl2{
  50%{transform:translateY(-12px)}
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px 16px;
  max-width:680px;
  margin:30px auto 0;
}

.pol{
  position:relative;
  background:#FFFFFF;
  padding:8px 8px 24px;
  border:1px solid #EC5F8C;
  border-radius:6px;
  box-shadow:0 0 18px rgba(236,95,140,.45),0 12px 26px rgba(0,0,0,.65);
  transform:rotate(var(--r,0deg));
  transition:.35s;
  cursor:pointer;
}

.pw:nth-child(even){margin-top:20px}

.pol:active,
.pol:hover{
  transform:rotate(0) scale(1.05);
  z-index:3;
  border-color:#E0527F;
  box-shadow:0 0 24px rgba(240,100,143,.6),0 12px 26px rgba(0,0,0,.65);
}

.pol img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
  border-radius:2px;
}

.pol img.landscape{
  object-fit:contain;
  background:#FFF3F6;
}

.mini{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:600;
  font-style:italic;
  font-size:clamp(26px,7.6vw,34px);
  color:#E0527F;
  text-shadow:0 0 15px rgba(255,160,190,.45);
  margin:52px 0 6px;
}

.vrow{
  display:flex;
  gap:14px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding:10px 6vw 22px;
  margin:0 -16px;
  -webkit-overflow-scrolling:touch;
}

.vrow::-webkit-scrollbar{display:none}

.vcard{
  flex:0 0 74%;
  max-width:290px;
  scroll-snap-align:center;
  background:#FFFFFF;
  border:1px solid #EC5F8C;
  border-radius:22px;
  padding:8px;
  box-shadow:0 0 20px rgba(236,95,140,.45),0 14px 30px rgba(0,0,0,.6);
}

.vcard video{
  width:100%;
  aspect-ratio:9/14;
  object-fit:contain;
  background:#FFF3F6;
  border-radius:15px;
  display:block;
}

.nov{
  aspect-ratio:9/14;
  border-radius:15px;
  background:linear-gradient(135deg,#FFFFFF,#FFE9EF);
  border:1px dashed #EC5F8C;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:13px;
  padding:12px;
  color:#7A4A63;
  gap:8px;
}

.nov b{font-size:34px}

.swipe{
  font-size:12px;
  opacity:.7;
  margin-top:2px;
  color:#7A4A63;
}

/* FRIENDS PHOTO SWIPE LAYOUT */
.blk.fr .grid{
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  gap:16px;
  max-width:100%;
  margin:30px auto 0;
  padding:12px 8px 24px;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  touch-action:pan-x;
}

.blk.fr .grid::-webkit-scrollbar{display:none}

.blk.fr .pw{
  flex:0 0 85%;
  width:85%;
  max-width:420px;
  margin-top:0;
  scroll-snap-align:center;
  display:flex;
}

.blk.fr .pol{
  width:100%;
  box-sizing:border-box;
  padding:8px 8px 24px;
  transform:none;
  display:flex;
  flex-direction:column;
}

.blk.fr .pol img{
  width:100%;
  height:240px;
  aspect-ratio:auto;
  object-fit:contain;
  background:#FFF3F6;
  display:block;
  border-radius:2px;
  flex-shrink:0;
}

.blk.fr .pol:hover,
.blk.fr .pol:active{transform:scale(1.02)}

/* SEPARATE SPECIAL PERSON SECTION */
.blk.special{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(236,95,140,.30),transparent 55%),
    radial-gradient(ellipse at 50% 100%,rgba(255,160,185,.20),transparent 55%),
    #FFE9EF;
  padding-bottom:100px;
}

.special-subtitle{
  max-width:320px;
  margin:10px auto 28px;
  line-height:1.7;
}

.special-card{
  width:100%;
  max-width:420px;
  margin:30px auto 0;
  padding:14px;
  box-sizing:border-box;
  background:#FFFFFF;
  border:1px solid #EC5F8C;
  border-radius:8px;
  box-shadow:0 0 22px rgba(236,95,140,.4),0 14px 30px rgba(0,0,0,.55);
}

.special-label{
  margin:4px 0 16px;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(25px,6.5vw,34px);
  font-style:italic;
  font-weight:600;
  line-height:1.2;
  color:#F7C4D1;
  text-shadow:0 0 12px rgba(255,160,190,.3);
}

.special-photo{
  position:relative;
  width:100%;
  height:260px;
  overflow:hidden;
  background:#FFF3F6;
  border-radius:4px;
}

.special-photo img{
  display:block;
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#FFF3F6;
}

/* OPAQUE COVER: THE PHOTO IS HIDDEN UNTIL CLICKED */
.ribbon-cover{
  position:absolute;
  inset:0;
  z-index:5;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  background:linear-gradient(145deg,#FF9DB8,#EC5F8C 48%,#FF9DB8);
  -webkit-tap-highlight-color:transparent;
  transition:opacity .65s ease,visibility .65s ease;
}

.ribbon-cover::before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(247,196,209,.65);
  pointer-events:none;
}

.ribbon-decoration{
  position:absolute;
  top:19px;
  left:0;
  right:0;
  text-align:center;
  font-size:17px;
  letter-spacing:8px;
  color:#F7C4D1;
}

.ribbon-horizontal{
  position:absolute;
  left:0;
  right:0;
  top:43%;
  height:48px;
  background:linear-gradient(180deg,#F7C4D1,#E0527F 45%,#B85D7C);
  border-top:1px solid rgba(255,255,255,.6);
  border-bottom:1px solid rgba(255,255,255,.25);
  box-shadow:0 3px 12px rgba(0,0,0,.35);
}

.ribbon-vertical{
  position:absolute;
  top:0;
  bottom:0;
  left:calc(50% - 17px);
  width:34px;
  background:linear-gradient(90deg,#B85D7C,#F7C4D1 45%,#E0527F);
  box-shadow:2px 0 8px rgba(0,0,0,.18);
}

.ribbon-bow{
  position:absolute;
  left:50%;
  top:43%;
  width:82px;
  height:58px;
  transform:translate(-50%,-40%);
  z-index:2;
}

.ribbon-bow::before,
.ribbon-bow::after{
  content:"";
  position:absolute;
  top:5px;
  width:36px;
  height:29px;
  background:linear-gradient(135deg,#F9D5DE,#E0527F);
  border:2px solid #F7C4D1;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}

.ribbon-bow::before{
  left:1px;
  border-radius:80% 20% 65% 30%;
  transform:rotate(20deg);
}

.ribbon-bow::after{
  right:1px;
  border-radius:20% 80% 30% 65%;
  transform:rotate(-20deg);
}

.ribbon-knot{
  position:absolute;
  left:50%;
  top:18px;
  width:20px;
  height:20px;
  border-radius:6px;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#FFE5EB,#E0527F);
  border:2px solid #F7C4D1;
  z-index:3;
}

.ribbon-hint{
  position:absolute;
  left:0;
  right:0;
  bottom:25px;
  z-index:3;
  text-align:center;
  color:#4A1F3A;
  font-family:'Manrope',sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
  text-shadow:0 2px 8px #000;
}

.special-message{
  display:none;
  padding:20px 6px 4px;
  color:#F7C4D1;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(22px,6vw,30px);
  font-weight:600;
  font-style:italic;
  line-height:1.4;
  text-align:center;
}

.special-card.unlocked .ribbon-cover{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.special-card.unlocked .special-message{
  display:block;
  animation:specialFade .8s ease both;
}

.special-note{
  display:block;
  margin-top:10px;
  font-family:'Manrope',sans-serif;
  font-size:11px;
  font-weight:500;
  font-style:normal;
  letter-spacing:1.4px;
  color:#7A4A63;
}

@keyframes specialFade{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

@media(min-width:700px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .vrow{justify-content:center;flex-wrap:wrap;overflow:visible}
  .vcard{flex:0 0 260px}

  .blk.fr .pw{
    flex:0 0 420px;
    width:420px;
    max-width:420px;
  }

  .blk.fr .pol img{height:280px}
  .special-photo{height:280px}
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="cute.css"></head>

<body data-gift="4" data-hearts>

<div id="root"></div>
<div id="lb"></div>

<script src="giftcommon.js"></script>

<script>
/* PHOTO FILES
   FAMILY: family/1.jpg to family/10.jpg
   FRIENDS: friends/1.jpg to friends/8.jpg
   SPECIAL PERSON: friends/9.jpg
*/

const SECTIONS=[
  {
    cls:"fa",
    dir:"family",
    title:"Family",
    sub:"May this little home always be filled with love, laughter & happy hearts.",
    photos:10,
    videos:0,
    vtitle:""
  },
  {
    cls:"fr",
    dir:"friends",
    title:"Frieds of life",
    sub:"The ones who bring your happiness and peace",
    photos:8,
    videos:0
  }
];

const root=document.getElementById("root");
const tilt=[-4,3,2,-3,4,-2,3,-4];

/* FAMILY SECTION AND FRIENDS SECTION */
SECTIONS.forEach(S=>{
  const b=document.createElement("section");
  b.className="blk "+S.cls;

  b.innerHTML=`
    <div class="dec" style="top:5%;left:8%">♡</div>
    <div class="dec" style="top:9%;right:9%;animation-delay:1s">✦</div>
    <h2 class="ttl rv">${S.title}</h2>
    <p class="sub rv">${S.sub}</p>
    <div class="grid"></div>
    ${S.videos>0?`
      <h3 class="mini rv">${S.vtitle}</h3>
      <p class="sub swipe">swipe →</p>
      <div class="vrow"></div>
    `:``}
  `;

  const g=b.querySelector(".grid");

  for(let i=1;i<=S.photos;i++){
    const w=document.createElement("div");
    w.className="pw rv";

    const d=document.createElement("div");
    d.className="pol";
    d.style.setProperty("--r",tilt[(i-1)%8]+"deg");

    const im=loadImg(S.dir+"/"+i,S.dir+" "+i);

    if(S.dir==="family"&&[1,5,6,7].includes(i)){
      im.classList.add("landscape");
    }

    im.onclick=()=>openLB(im.src);

    d.appendChild(im);
    w.appendChild(d);
    g.appendChild(w);
  }

  if(S.videos>0){
    const vr=b.querySelector(".vrow");

    for(let i=1;i<=S.videos;i++){
      const path=S.dir+"/v"+i+".mp4";
      const c=document.createElement("div");
      c.className="vcard";

      const v=document.createElement("video");
      v.controls=true;
      v.playsInline=true;
      v.preload="metadata";
      v.src=path+"#t=0.5";

      v.onerror=()=>{
        c.innerHTML='<div class="nov"><b>🎬</b>video kaanom<br>'+path+'</div>';
      };

      c.appendChild(v);
      vr.appendChild(c);
    }
  }

  root.appendChild(b);
});

/* THIRD SECTION: TO MY SPECIAL PERSON */
const special=document.createElement("section");
special.className="blk special";

special.innerHTML=`
  <div class="dec" style="top:5%;left:8%">♡</div>
  <div class="dec" style="top:9%;right:9%;animation-delay:1s">✦</div>

  <h2 class="ttl rv">To Your Special Person</h2>
  <p class="sub special-subtitle rv">
    A little place made just for you 🤍
  </p>

  <div class="special-card rv">
    <div class="special-label">A little surprise for you 🎀</div>

    <div class="special-photo">
      <div class="ribbon-cover" role="button" tabindex="0"
           aria-label="Touch the ribbon to reveal the special photo">

        <div class="ribbon-decoration">♡ ✦ ♡ ✦ ♡</div>
        <div class="ribbon-horizontal"></div>
        <div class="ribbon-vertical"></div>

        <div class="ribbon-bow">
          <div class="ribbon-knot"></div>
        </div>

        <div class="ribbon-hint">TOUCH TO UNWRAP ♡</div>
      </div>
    </div>

    <div class="special-message">
      Your's first priority<br>
      My Sakalathan 
      <span class="special-note">Kataisi varaikum nalla irrugada ♡</span>
    </div>
  </div>
`;

/*
  Important:
  The special image is NOT added to the page until the ribbon is touched.
  So the photo remains completely hidden before opening.
*/
const specialCard=special.querySelector(".special-card");
const specialPhoto=special.querySelector(".special-photo");
const ribbonCover=special.querySelector(".ribbon-cover");

let specialOpened=false;

function openSpecialPhoto(){
  if(specialOpened)return;
  specialOpened=true;

  const photo=loadImg("friends/9","Special Person");
  photo.alt="To My Special Person";
  photo.className="special-revealed-photo";

  specialPhoto.insertBefore(photo,ribbonCover);
  specialCard.classList.add("unlocked");
}

ribbonCover.addEventListener("click",openSpecialPhoto);

ribbonCover.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){
    e.preventDefault();
    openSpecialPhoto();
  }
});

/* Add special section BELOW Friends */
root.appendChild(special);

/* Existing reveal animations */
rvObserve();

/* Only one video plays at a time */
document.addEventListener("play",e=>{
  document.querySelectorAll("video").forEach(v=>{
    if(v!==e.target)v.pause();
  });
  pulseNext();
},true);
</script>

<script src="cute.js"></script></body>
</html>
